<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!--../static/css/style.css-->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Each child page sets its own <title>text</title>; this pattern
         swaps it into "text - KoKo". A child that doesn't set a title
         just gets "KoKo". -->
    <title layout:title-pattern="$CONTENT_TITLE - KoKo">KoKo</title>
</head>

<body>

<header>

    <!-- LEFT — profile-specific. A child page overrides this whole block
         by declaring its own <div layout:fragment="header-left">...</div>.
         This is the fallback shown when a child doesn't override it
         (currently: the guest index page). -->
    <div class="header-left" layout:fragment="header-left">

        <a class="auth-item" id="signin-trigger" th:href="@{/login}" data-tooltip="Sign In">
            <i class="bi bi-box-arrow-in-right auth-icon"></i>
            <span>Sign In</span>
        </a>

        <a class="auth-item" id="signup-trigger" th:href="@{/register}" data-tooltip="Sign Up">
            <i class="bi bi-person-plus auth-icon"></i>
            <span>Sign Up</span>
        </a>

    </div>

    <!-- CENTER — same on every page, not a fragment -->
    <a th:href="@{/}">
        <img th:src="@{/images/kokoLogo.png}" alt="KoKo" class="logo">
    </a>

    <!-- RIGHT — profile-specific, same override mechanism as header-left -->
    <div class="header-right" layout:fragment="header-right">

        <a class="auth-item" data-tooltip="About" th:href="@{/}">
            <i class="bi bi-info-circle auth-icon"></i>
            <span>About</span>
        </a>

        <a class="auth-item" data-tooltip="Cart" th:href="@{/}">
            <i class="bi bi-cart3 auth-icon"></i>
            <span>Cart</span>
        </a>

        <a class="auth-item" data-tooltip="Add Business" th:href="@{/}">
            <i class="bi bi-plus-circle auth-icon"></i>
            <span>Add Business</span>
        </a>

    </div>

</header>

<!-- MAIN BODY — shared design across every profile. A child page can
     override this by declaring its own <main layout:fragment="content">,
     but per the current spec none of them do: user.html, business.html
     and runner.html all inherit this exact markup untouched, and only
     override the header fragments above. -->
<main layout:fragment="content">

    <!-- TOP RATED SECTION -->
    <section class="top-rated-section">

        <div class="top-rated-header">
            <h2>TOP RATED</h2>
            <p> < - - Swipe to explore top businesses near you - - > </p>
        </div>

        <!-- REGION SELECT — same pill-button treatment as the Categories
             button in the map section below (.map-btn), just centered
             with its own spacing. -->
        <div class="region-select-wrapper">
            <button class="region-btn" type="button">
                <i class="bi bi-geo-alt"></i>
                Select Region
            </button>
        </div>

        <div class="stories-container">

            <div class="story-card active">1</div>
            <div class="story-card active">2</div>
            <div class="story-card active">3</div>
            <div class="story-card active">4</div>
            <div class="story-card active">5</div>
            <div class="story-card active">6</div>
            <div class="story-card active">7</div>
            <div class="story-card active">8</div>
            <div class="story-card active">9</div>
            <div class="story-card active">10</div>
            <div class="story-card active">11</div>
            <div class="story-card active">12</div>
            <div class="story-card active">13</div>
            <div class="story-card active">14</div>
            <div class="story-card active">15</div>

        </div>
    </section>

    <!-- MAP SECTION -->
    <section class="map-section">

        <div class="map-header">
            <h2>FIND</h2>
            <p>Search or show categories / Tap the icon on map to view </p>
        </div>

        <!-- SEARCH + CATEGORY BAR -->
        <div class="map-controls">

            <input type="text" class="map-search" placeholder="Search..." />

            <button class="map-btn">
                <i class="bi bi-grid"></i>
                Categories
            </button>

        </div>
        <div id="map" class="map-container"></div>

    </section>

</main>

<footer>

    <!-- BOTTOM ACTION BAR — commented out to match current index.html;
         re-enable when this piece of the design is ready. Left as a
         plain (non-fragment) block since no profile needs it to differ
         yet - turn it into a layout:fragment the same way as the header
         blocks above if that changes. -->
    <!--
    <div class="bottom-actions">

        <button class="bottom-btn right" data-tooltip="AI Waiter">
            <i class="bi bi-cpu"></i>
            <span> AI Waiter</span>
        </button>

        <button class="bottom-btn center" data-tooltip="Explore">
            <i class="bi bi-compass"></i>
            <span>Explore</span>
        </button>

        <button class="bottom-btn left" data-tooltip="Buy / Sell a business">
            <i class="bi bi-arrow-left-right"></i>
            <span>Buy / Sell a business</span>
        </button>

    </div>
    -->

    <p>&copy; 2026 KoKo. All rights reserved.</p>
</footer>

<script th:src="@{/js/api.js}"></script>
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/Ui.js}"></script>

</body>
</html>
