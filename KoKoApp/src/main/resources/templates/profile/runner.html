<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{home/layout}">
<head>
    <title>Runner Dashboard</title>
</head>
<body>

     the inheritance mechanism per the sprint task. Swap freely. -->

<div class="header-left" layout:fragment="header-left">

    <a class="auth-item" data-tooltip="More" th:href="@{/}">
        <i class="bi bi-three-dots auth-icon"></i>
        <span>Menu</span>
    </a>

    <a class="auth-item auth-item-topup" data-tooltip="Top Up" th:href="@{/}">
        <i class="bi bi-cash-coin auth-icon"></i>

    </a>

        <a class="auth-item" data-tooltip="Available Deliveries" th:href="@{/}">

        <a class="auth-item" data-tooltip="My Route" th:href="@{/}">
            <i class="bi bi-signpost-2 auth-icon"></i>
            <span>Route</span>
        </a>
    -->
</div>

<div class="header-right" layout:fragment="header-right">

    <a class="auth-item" data-tooltip="Earnings" th:href="@{/}">
        <i class="bi bi-wallet2 auth-icon"></i>
        <span>Earnings</span>
    </a>

    <a class="auth-item" data-tooltip="Support" th:href="@{/}">
        <i class="bi bi-headset auth-icon"></i>
        <span>Support</span>
    </a>

    <a class="auth-item" data-tooltip="Cart" th:href="@{/}">
        <i class="bi bi-cart3 auth-icon"></i>

    <a class="auth-item" data-tooltip="Logout" th:href="@{/}">
        <i class="bi bi-box-arrow-right auth-icon"></i>
        <span>Logout</span>
