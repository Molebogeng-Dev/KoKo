spring.application.name=KoKoApp
server.port=1620

# ==============================================
# DATABASE (Neon - PostgreSQL)
# ==============================================
# ${DB_URL}/${DB_USERNAME}/${DB_PASSWORD} are read from environment
# variables at startup - never hardcode real values here, this file
# gets committed to git. Set them in your IDE run config locally, and
# as real environment variables on the Oracle VM in production.
#
# DB_URL should be Neon's connection string, e.g.:
#   jdbc:postgresql://<host>/<dbname>?sslmode=require
# (note the jdbc: prefix - Neon's dashboard gives you a plain
# postgresql:// URL, which needs jdbc: added to the front for Spring)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Lets Hibernate create/update tables from the entity classes automatically
# during development, so we don't hand-write schema SQL yet. Worth
# switching to a proper migration tool (e.g. Flyway) before production,
# but "update" is the right call for this stage.
spring.jpa.hibernate.ddl-auto=update

# Prints the SQL Hibernate generates - useful right now for sanity-checking
# that the register endpoint is actually inserting what we expect. Can be
# turned off later once this is proven out.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================================
# OBJECT STORAGE (Cloudflare R2 - S3-compatible)
# ==============================================
# Same rule as the DB block above - these are all env-var placeholders,
# nothing hardcoded here.
#
# R2_ACCOUNT_ID: found on your Cloudflare R2 dashboard
# R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY: generated via
#   R2 -> Manage R2 API Tokens -> create a token scoped to the bucket
#   below with Object Read & Write permissions
# R2_BUCKET_NAME: the bucket you created for user photos
r2.account-id=${R2_ACCOUNT_ID}
r2.access-key-id=${R2_ACCESS_KEY_ID}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY}
r2.bucket-name=${R2_BUCKET_NAME}